name: CI & GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (sim rules, 40 rooms, ads settle-once, saves, i18n)
        run: npm test
      - name: Playtest audit (bot solves all 40 rooms, no camping guards, no early sightings, win rates)
        run: npm run audit
      - name: Build (web / GitHub Pages)
        run: npm run build
      - name: Build is path-independent (works under any repo name)
        run: |
          grep -q 'src="./assets/' dist/index.html
          ! grep -rnE '"/assets/|Pet-Escape-Hotel/' dist/
      - name: Bundle size must stay under 5 MB
        run: |
          size=$(du -sb dist | cut -f1)
          echo "dist size: $size bytes"
          test "$size" -lt 5000000
      - name: Playwright e2e (390px, web + CrazyGames builds)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Build CrazyGames package
        run: npm run build:crazygames
      - name: CrazyGames package is one self-contained file (no asset that can go missing)
        run: |
          test "$(find dist-crazygames -type f)" = "dist-crazygames/index.html"
          ! grep -qE 'crossorigin|rel="manifest"|src="\./assets|href="\./' dist-crazygames/index.html
      - name: CrazyGames package limits (< 50 MB, < 1500 files)
        run: |
          size=$(du -sb dist-crazygames | cut -f1)
          files=$(find dist-crazygames -type f | wc -l)
          echo "size $size bytes, $files files"
          test "$size" -lt 50000000
          test "$files" -lt 1500
      - name: Upload CrazyGames build (download = ready-to-upload zip)
        uses: actions/upload-artifact@v7
        with:
          name: pet-escape-hotel-crazygames
          path: dist-crazygames/
          if-no-files-found: error
      - name: Committed submission zip is the CrazyGames build in pet-escape-hotel-v1/
        run: |
          test -f submission/pet-escape-hotel-v1.zip
          test "$(unzip -Z1 submission/pet-escape-hotel-v1.zip | grep -v '/$')" = "pet-escape-hotel-v1/index.html"
          unzip -p submission/pet-escape-hotel-v1.zip pet-escape-hotel-v1/index.html | grep -q 'sdk.crazygames.com/crazygames-sdk-v3.js'
          ! unzip -p submission/pet-escape-hotel-v1.zip pet-escape-hotel-v1/index.html | grep -qE 'src="\./assets|rel="manifest"'
      # GitHub Pages only accepts deployments from the default branch (environment protection rules)
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
