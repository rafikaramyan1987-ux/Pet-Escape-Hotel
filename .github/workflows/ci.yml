name: CI & GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests (puzzle rules, solver, levels, ads settle-once, GD / GamePix adapters, saves, i18n)
        run: npm test
      - name: Every language file has all English keys (10 languages)
        run: npm run check:i18n
      - name: Level audit → docs/levels-report.md (solvable, random-bot fail rate in tier band, traps, decisions, first decision, obvious bot, variety, moves)
        run: npm run audit
      - name: Build (web / GitHub Pages)
        run: npm run build
      - name: Build is path-independent (works under any repo name)
        run: |
          grep -q 'src="./assets/' dist/index.html
          ! grep -rnE '"/assets/|Pet-Escape-Hotel/' dist/
      - name: Bundle size must stay under 5 MB
        run: |
          size=$(du -sb dist | cut -f1)
          echo "dist size: $size bytes"
          test "$size" -lt 5000000
      - name: Playwright e2e (390px, web / CrazyGames / GameDistribution / GamePix builds, text fits in every language)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -- --trace off
      - name: Build every platform (web, crazygames, gd, gamepix)
        run: npm run build:web && npm run build:crazygames && npm run build:gd && npm run build:gamepix
      - name: GamePix bundle (build and newest submission zip) sets the legacy GamePix.soundOff / soundOn hooks and calls GamePix.lang()
        run: |
          gpx_hooks() {
            grep -qE 'GamePix\.soundOff[[:space:]]*=[^=]' "$1" || { echo "$2: no GamePix.soundOff= assignment"; return 1; }
            grep -qE 'GamePix\.soundOn[[:space:]]*=[^=]' "$1" || { echo "$2: no GamePix.soundOn= assignment"; return 1; }
            grep -qE 'GamePix\.lang\(\)' "$1" || { echo "$2: no GamePix.lang() call"; return 1; }
            echo "$2: GamePix.soundOff= / GamePix.soundOn= / GamePix.lang() ok"
          }
          gpx_hooks dist-gamepix/index.html dist-gamepix/index.html
          zip=$(ls submission-gamepix/screw-and-rescue-gamepix-v*.zip | sort -V | tail -n 1)
          mkdir -p ci-gpx && unzip -p "$zip" index.html > ci-gpx/index.html
          gpx_hooks ci-gpx/index.html "$zip"
      - name: Portal packages are one self-contained file each (no asset that can go missing)
        run: |
          for p in crazygames gd gamepix; do
            test "$(find dist-$p -type f)" = "dist-$p/index.html"
            ! grep -qE 'crossorigin|rel="manifest"|src="\./assets|href="\./' dist-$p/index.html
          done
      - name: Each build only has its own SDK (no other platform's SDK strings)
        run: |
          ! grep -qiE 'crazygames|gamedistribution|gamepix|gdsdk' dist/assets/*.js dist/index.html
          ! grep -qiE 'gamedistribution|gamepix|gdsdk' dist-crazygames/index.html
          ! grep -qiE 'crazygames|gamepix' dist-gd/index.html
          ! grep -qiE 'crazygames|gamedistribution|gdsdk' dist-gamepix/index.html
      - name: Fresh GD / GamePix zips from this build pass the zip checks (index.html at the root, right SDK, nothing else)
        run: |
          mkdir -p ci-zips
          zip -j -9 -X -q ci-zips/screw-and-rescue-gd-v1.zip dist-gd/index.html
          zip -j -9 -X -q ci-zips/screw-and-rescue-gamepix-v1.zip dist-gamepix/index.html
          node scripts/check-zips.mjs ci-zips/screw-and-rescue-gd-v1.zip ci-zips/screw-and-rescue-gamepix-v1.zip
      - name: Committed zips (GD, GamePix v1 + v2, CrazyGames v2) pass the zip checks
        run: npm run check:zips
      - name: CrazyGames package limits (< 50 MB, < 1500 files)
        run: |
          size=$(du -sb dist-crazygames | cut -f1)
          files=$(find dist-crazygames -type f | wc -l)
          echo "size $size bytes, $files files"
          test "$size" -lt 50000000
          test "$files" -lt 1500
      - name: Upload CrazyGames build (download = ready-to-upload zip)
        uses: actions/upload-artifact@v7
        with:
          name: screw-and-rescue-crazygames
          path: dist-crazygames/
          if-no-files-found: error
      - name: Committed submission zip is the CrazyGames build in screw-and-rescue-v1/
        run: |
          test -f submission/screw-and-rescue-v1.zip
          test "$(unzip -Z1 submission/screw-and-rescue-v1.zip | grep -v '/$')" = "screw-and-rescue-v1/index.html"
          unzip -p submission/screw-and-rescue-v1.zip screw-and-rescue-v1/index.html | grep -q 'sdk.crazygames.com/crazygames-sdk-v3.js'
          ! unzip -p submission/screw-and-rescue-v1.zip screw-and-rescue-v1/index.html | grep -qE 'src="\./assets|rel="manifest"'
      - name: Upload GD and GamePix builds
        uses: actions/upload-artifact@v7
        with:
          name: screw-and-rescue-gd-gamepix
          path: |
            dist-gd/
            dist-gamepix/
          if-no-files-found: error
      - name: Submission folders (CrazyGames covers / trailers / README, GD thumbnails, GamePix icon / cover / README)
        run: python3 scripts/check-submission.py
      # GitHub Pages only accepts deployments from the default branch (environment protection rules)
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  web:
    # open portals (itch.io, Newgrounds, Y8, Playgama): the ad-free web build as a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Web build + zip
        run: npm run build:web && node scripts/web/zip.mjs ci-web/screw-and-rescue-web.zip
      - name: Web zip checks (index.html at the root, no crazygames / gamedistribution / gamepix / googlesyndication, no http(s) request at runtime, iframe 640x480 / 960x600 / 1280x720 / 390x844, level 1 solved)
        run: node scripts/web/check.mjs ci-web/screw-and-rescue-web.zip --shots ci-web/checks
      - name: Committed zip (submission-web/screw-and-rescue-web-v1.zip) passes the same file checks
        run: node scripts/web/check.mjs submission-web/screw-and-rescue-web-v1.zip --static
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-zip-checks
          path: ci-web/

  playgama:
    # Playgama: Playgama Bridge from Playgama's CDN, initialized before the game bundle runs, as a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playgama build
        run: npm run build:playgama
      - name: Playgama build calls bridge.initialize() before the game bundle and sends the documented game_ready
        run: |
          f=dist-playgama/index.html
          head -c 400 $f | grep -qF '<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>' || { echo "$f: Bridge CDN script is not the first script in <head>"; exit 1; }
          grep -qF 'window.bridge.initialize()' $f || { echo "$f: no bridge.initialize() call"; exit 1; }
          grep -qF '<script type="text/plain" data-playgama-game' $f || { echo "$f: game bundle not held until bridge.initialize() settles"; exit 1; }
          ! grep -q '<script type="module"' $f || { echo "$f: a module script runs before bridge.initialize() settles"; exit 1; }
          grep -qF 'console.error(' $f || { echo "$f: initialize failure would be silent"; exit 1; }
          js=$(cat dist-playgama/assets/*.js)
          grep -qE "[\"'\`]game_ready[\"'\`]" <<< "$js" || { echo "dist-playgama: no game_ready message"; exit 1; }
          grep -qF '.sendMessage(' <<< "$js" || { echo "dist-playgama: no platform.sendMessage call"; exit 1; }
          echo "OK: $f initializes Bridge first and sends game_ready"
      - name: Playgama zip checks (index.html at the root, CDN Bridge first in <head>, initialize() before the game, game_ready, no crazygames / gamedistribution / gamepix, Playgama's precheck with no FAIL / WARN)
        run: node scripts/playgama/zip.mjs ci-playgama/screw-and-rescue-playgama.zip && node scripts/playgama/check.mjs ci-playgama/screw-and-rescue-playgama.zip
      - name: Committed zip (submission-playgama/screw-and-rescue-playgama-v2.zip) passes the same checks
        run: node scripts/playgama/check.mjs submission-playgama/screw-and-rescue-playgama-v2.zip
      - name: Playgama QA Tool harness (?platform_id=qa_tool; Bridge's initialize handshake, game_ready; failures logged, game playable)
        run: |
          node scripts/playgama/qa.mjs ci-playgama/screw-and-rescue-playgama.zip
          node scripts/playgama/qa.mjs submission-playgama/screw-and-rescue-playgama-v2.zip
      - name: Bridge test (mock platform + stubbed Playgama SDK; interstitial, rewarded completed / cancelled, muted during ads)
        run: node scripts/playgama/test.mjs ci-playgama/screw-and-rescue-playgama.zip
      - name: The other builds never contain Playgama Bridge
        run: |
          for m in web crazygames gd gamepix; do npm run build:$m; done
          for f in dist dist-crazygames dist-gd dist-gamepix; do if grep -rq -e playgama-bridge -e bridge.playgama.com $f; then echo "$f has Playgama Bridge"; exit 1; fi; done

  gamemonetize:
    # GameMonetize: SDK_OPTIONS + api.gamemonetize.com/sdk.js loaded once at boot; interstitials only at natural breaks
    # after a click; no rewarded ads (the SDK has none); a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: GameMonetize adapter unit tests (pause + mute, resume, settles once, pre-roll / 2-minute gap, no rewarded)
        run: npx vitest run tests/gamemonetize.test.ts
      - name: GameMonetize build + fresh zip checks (index.html at the root, SDK_OPTIONS + game id, sdk.js the only external URL, no other SDK; thumbnails 512x384 / 512x512 / 512x340 JPG < 300 KB; README limits)
        run: npm run build:gamemonetize && node scripts/gamemonetize/zip.mjs ci-gamemonetize/screw-and-rescue-gamemonetize.zip
      - name: Committed zip (submission-gamemonetize/screw-and-rescue-gamemonetize-v1.zip) passes the same checks
        run: npm run check:gamemonetize
      - name: Playwright smoke test of dist-gamemonetize (stubbed SDK; loads, no ad before a click, pre-roll, level 1 played, no rewarded buttons, ad blocker, no console errors)
        run: npm run e2e:gamemonetize -- --trace off
      - name: The other builds never contain the GameMonetize SDK
        run: |
          for m in web crazygames gd gamepix playgama y8; do npm run build:$m; done
          for f in dist dist-crazygames dist-gd dist-gamepix dist-playgama dist-y8; do if grep -rqi -e gamemonetize -e qd017r024ijevcoihn7kl2hkyvkw2t7z $f; then echo "$f has GameMonetize code"; exit 1; fi; done

  y8:
    # Y8: y8.min.js from Y8's CDN (async, never bundled), initialized as the portal snippet; start / next interstitials
    # only from clicks, rewarded only after adViewed; pause + mute on hidden / blur; a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: ffprobe for the video checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Y8 adapter unit tests (portal-snippet init, no ad before init, beforeAd / afterAd, settles once, reward only on adViewed, hidden / blur pause)
        run: npx vitest run tests/y8.test.ts
      - name: Y8 build + fresh zip checks (index.html at the root, CDN SDK async in <head>, never bundled, app / game id, no other SDK; every media file at its exact size, videos 20-30 s < 50 MB)
        run: npm run build:y8 && node scripts/y8/zip.mjs ci-y8/screw-and-rescue-y8.zip
      - name: Committed zip (submission-y8/screw-and-rescue-y8-v1.zip) passes the same checks
        run: npm run check:y8
      - name: Playwright smoke test of dist-y8 (stubbed SDK; loads, init before any ad, start / next, level 1 played, rewarded, blur / hidden pause, ad blocker, no console errors)
        run: npm run e2e:y8 -- --trace off
      - name: The other builds never contain the Y8 SDK
        run: |
          for m in web crazygames gd gamepix playgama gamemonetize; do npm run build:$m; done
          for f in dist dist-crazygames dist-gd dist-gamepix dist-playgama dist-gamemonetize; do if grep -rqi -e cdn.y8.com -e y8sdk -e 6af4b159ca1c6869a74e059b $f; then echo "$f has Y8 code"; exit 1; fi; done
